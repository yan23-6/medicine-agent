[project]
name = "medicine-agent"
version = "0.1.0"
description = "Provider-neutral medical knowledge skill runtime and experimental package pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "onnxruntime>=1.20,<2",
    "pillow>=11,<13",
    "pydantic>=2.12,<3",
    "pypdfium2>=4.30,<6",
    "python-docx>=1.2,<2",
    "rapidocr>=3,<4",
]

[project.scripts]
medicine-agent = "medicine_agent.cli:main"
medicine-agent-preflight = "medicine_agent.preflight:main"
medicine-agent-wheelhouse = "medicine_agent.wheelhouse:main"
medicine-agent-ocr-resources = "medicine_agent.ocr_resources:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "reportlab>=4,<5",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "medicine_agent"
module-root = "src"


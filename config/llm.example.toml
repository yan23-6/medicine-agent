# 复制为 config/llm.local.toml 后再填写真实值。
# llm.local.toml 已被 Git 忽略；不要在本模板中填写真实密钥。
[llm]
provider = "openai-compatible"
# API 根地址；运行时会自动拼接 /chat/completions。
base_url = "https://your-provider.example/v1"
api_key = "replace-with-your-local-secret"
model = "replace-with-model-name"
timeout_seconds = 60
max_retries = 2

